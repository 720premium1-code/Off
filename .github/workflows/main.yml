name: Para Takip APK Oluştur

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/main.yml'
      - 'para-takip-android-proje.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4

      - name: Android projesini çıkar
        run: |
          unzip -o para-takip-android-proje.zip -d project

      - name: APK oluştur
        run: |
          cd project/ParaTakipAndroid
          gradle assembleDebug

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: para-takip-apk
          path: project/ParaTakipAndroid/app/build/outputs/apk/debug/app-debug.apk
